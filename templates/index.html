<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agent — Golden T Edition</title>
  
  <!-- Premium Fonts: Outfit (Display) + Plus Jakarta Sans + Noto Sans Gujarati -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* ── Claude / Groq Premium Warm Dark Palette ───────────────── */
    :root {
      --bg-dark:          #0c0d12;
      --bg-sidebar:       #12141d;
      --bg-card:          rgba(20, 23, 34, 0.75);
      --bg-input:         #181b26;

      --warm-gold:        #d4af37;
      --warm-gold-light:  #f3e5ab;
      --warm-gold-glow:   rgba(212, 175, 55, 0.28);
      --warm-amber:       #f59e0b;

      --text-main:        #f1f5f9;
      --text-secondary:   #94a3b8;
      --text-muted:       #475569;

      --border-subtle:    rgba(255, 255, 255, 0.08);
      --border-gold:      rgba(212, 175, 55, 0.35);

      --font-display:     'Outfit', 'Noto Sans Gujarati', sans-serif;
      --font-body:        'Plus Jakarta Sans', 'Noto Sans Gujarati', sans-serif;

      --radius-xl:        24px;
      --radius-lg:        16px;
      --radius-md:        10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── Slim Minimal Sidebar ───────────────────────────────────── */
    .sidebar {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--warm-gold-light);
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateY(-1px);
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--warm-gold);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin: 12px 6px 2px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .history-item.active {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--border-gold);
      color: var(--warm-gold-light);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-delete-chat {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      opacity: 0;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .history-item:hover .btn-delete-chat { opacity: 1; }
    .btn-delete-chat:hover { color: #ef4444; }

    /* ── Main Stage ─────────────────────────────────────────────── */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-dark);
    }

    /* Top Header Bar */
    .header-bar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .header-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo-mini {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e2638, #0c1019);
      border: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo-mini svg {
      width: 18px;
      height: 18px;
    }

    .header-title-text {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--warm-gold-light);
    }

    /* ── Chat Canvas ─────────────────────────────────────────────── */
    .chat-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .chat-canvas::-webkit-scrollbar { width: 6px; }
    .chat-canvas::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px;
    }

    /* ── Golden 'T' 3D Logo & Electron Track Animation ───────────── */
    .hero-centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
      text-align: center;
      gap: 32px;
      padding: 0 20px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-orbit-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Soft Warm Light Ambient Radial Glow */
    .logo-soft-glow {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--warm-gold-glow) 0%, transparent 70%);
      filter: blur(18px);
      animation: ambientGlow 4s ease-in-out infinite alternate;
    }

    @keyframes ambientGlow {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.18); opacity: 1; }
    }

    /* 3D Golden Brushed 'T' Emblem */
    .logo-3d-emblem {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1c2333 0%, #090c14 100%);
      border: 2px solid var(--warm-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.85), 0 0 30px var(--warm-gold-glow);
      z-index: 2;
    }

    /* Orbital Electron Track Ring */
    .electron-track {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px dashed rgba(212, 175, 55, 0.4);
      animation: rotateTrack 10s linear infinite;
    }

    /* Revolving Glowing Electron Dot */
    .electron-dot {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--warm-gold-light);
      box-shadow: 0 0 12px var(--warm-gold-light), 0 0 24px var(--warm-gold);
    }

    @keyframes rotateTrack {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hero-headline {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    /* ── Messages ────────────────────────────────────────────────── */
    .msg-row {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 16px;
      animation: msgFadeIn 0.35s ease;
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e2638, #0c1019);
      border: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .msg-avatar svg {
      width: 20px;
      height: 20px;
    }

    .msg-bubble {
      font-size: 15px;
      line-height: 1.65;
    }

    .msg-row.user .msg-bubble {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--border-gold);
      padding: 12px 20px;
      border-radius: 20px;
      border-top-right-radius: 4px;
      max-width: 80%;
      color: var(--warm-gold-light);
    }

    .msg-row.agent .msg-bubble {
      flex: 1;
      padding-top: 4px;
      color: var(--text-main);
    }

    .msg-bubble pre {
      background: #06070a;
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13.5px;
    }

    .msg-bubble code {
      background: rgba(212, 175, 55, 0.1);
      color: var(--warm-gold-light);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
    }

    .msg-bubble pre code { background: none; padding: 0; color: inherit; }

    /* Typing Dots */
    .typing-flair {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 8px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warm-gold);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.7); }
      40% { opacity: 1; transform: scale(1.1); background: var(--warm-gold-light); }
    }

    /* ── Floating Centered Input Box ─────────────────────────────── */
    .dock-container {
      padding: 16px 20px 28px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      z-index: 10;
    }

    .input-pill-bar {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 12px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .input-pill-bar:focus-within {
      border-color: var(--warm-gold);
      box-shadow: 0 10px 40px rgba(212, 175, 55, 0.15);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 200px;
      min-height: 26px;
      padding: 2px 0;
    }

    #user-input::placeholder { color: var(--text-muted); }

    .btn-send-gold {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--warm-gold), var(--warm-amber));
      color: #0c0d12;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--warm-gold-glow);
    }

    .btn-send-gold svg {
      width: 16px;
      height: 16px;
      fill: #0c0d12;
    }

    .btn-send-gold:hover:not(:disabled) {
      transform: scale(1.06);
    }

    .btn-send-gold:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .dock-container { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ── Slim Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar">
    <button class="btn-new-chat" onclick="createNewChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      + New Chat
    </button>

    <div class="sidebar-label">Chat History</div>

    <div class="history-list" id="history-list">
      <!-- localStorage Chat Items -->
    </div>
  </aside>

  <!-- ── Main Stage ─────────────────────────────────────────────── -->
  <main class="main-stage">

    <!-- Header Bar (Appears when chat starts) -->
    <header class="header-bar" id="header-bar">
      <div class="header-brand">
        <div class="header-logo-mini">
          <!-- Mini Golden T Logo -->
          <svg viewBox="0 0 100 100">
            <defs>
              <linearGradient id="miniGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F3E5AB" />
                <stop offset="50%" stop-color="#D4AF37" />
                <stop offset="100%" stop-color="#AA7C11" />
              </linearGradient>
            </defs>
            <path d="M 22 25 L 78 25 L 78 35 L 57 35 L 57 80 L 43 80 L 43 35 L 22 35 Z" fill="url(#miniGold)" />
            <circle cx="28" cy="28" r="2.5" fill="#F3E5AB" />
            <circle cx="72" cy="28" r="2.5" fill="#F3E5AB" />
            <circle cx="53" cy="74" r="2.5" fill="#F3E5AB" />
          </svg>
        </div>
        <div class="header-title-text">Smart Agent</div>
      </div>
    </header>

    <!-- Chat Canvas -->
    <div class="chat-canvas" id="chat-canvas">

      <!-- Centered Golden 'T' 3D Logo with Ambient Glow & Electron Track -->
      <div class="hero-centered" id="hero-centered">
        <div class="logo-orbit-container">
          <!-- Soft Warm Glow -->
          <div class="logo-soft-glow"></div>

          <!-- Revolving Electron Track Animation -->
          <div class="electron-track">
            <div class="electron-dot"></div>
          </div>

          <!-- 3D Golden Brushed 'T' Emblem -->
          <div class="logo-3d-emblem">
            <svg viewBox="0 0 100 100">
              <defs>
                <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFF6C8" />
                  <stop offset="35%" stop-color="#F3E5AB" />
                  <stop offset="70%" stop-color="#D4AF37" />
                  <stop offset="100%" stop-color="#997A15" />
                </linearGradient>
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
                </filter>
              </defs>

              <!-- Classical 'T' Path with Tech Circuit Detailing -->
              <path d="M 20 22 H 80 C 80 22, 76 24, 76 30 C 76 33, 78 34, 78 34 V 36 H 58 V 74 C 58 78, 62 78, 65 78 V 80 H 35 V 78 C 38 78, 42 78, 42 74 V 36 H 22 V 34 C 22 34, 24 33, 24 30 C 24 24, 20 22, 20 22 Z" 
                    fill="url(#goldMetallic)" filter="url(#dropShadow)" />

              <!-- Circuit Lines Top-Left -->
              <path d="M 24 26 L 32 26 L 35 29" stroke="#997A15" stroke-width="1.5" fill="none" />
              <circle cx="35" cy="29" r="1.8" fill="#FFF6C8" />

              <!-- Circuit Lines Top-Right -->
              <path d="M 76 26 L 68 26 L 65 29" stroke="#997A15" stroke-width="1.5" fill="none" />
              <circle cx="65" cy="29" r="1.8" fill="#FFF6C8" />

              <!-- Circuit Lines Bottom-Right Stem -->
              <path d="M 50 64 L 54 68 L 54 74" stroke="#997A15" stroke-width="1.5" fill="none" />
              <circle cx="54" cy="74" r="1.8" fill="#FFF6C8" />
              <path d="M 50 68 L 51.5 69.5" stroke="#997A15" stroke-width="1.5" fill="none" />
              <circle cx="51.5" cy="69.5" r="1.2" fill="#FFF6C8" />
            </svg>
          </div>
        </div>

        <div class="hero-headline">How can I help you today?</div>
      </div>

    </div>

    <!-- Centered Auto-Resizing Input Dock -->
    <div class="dock-container">
      <div class="input-pill-bar">
        <textarea
          id="user-input"
          placeholder="How can I help you today?"
          rows="1"
        ></textarea>
        <button class="btn-send-gold" id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </main>
</div>

<script>
  let currentSessionId = '';
  let isLoading = false;

  const chatCanvas   = document.getElementById('chat-canvas');
  const userInput    = document.getElementById('user-input');
  const sendBtn      = document.getElementById('send-btn');
  const heroCentered = document.getElementById('hero-centered');
  const headerBar    = document.getElementById('header-bar');
  const historyList  = document.getElementById('history-list');

  /* ── Multi-Chat Storage (localStorage) ──────────────────── */
  function getStoredChats() {
    return JSON.parse(localStorage.getItem('smart_agent_chats') || '[]');
  }

  function saveStoredChats(chats) {
    localStorage.setItem('smart_agent_chats', JSON.stringify(chats));
  }

  function renderHistorySidebar() {
    const chats = getStoredChats();
    historyList.innerHTML = '';

    if (chats.length === 0) {
      historyList.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:8px;">No chat history</div>`;
      return;
    }

    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = `history-item ${c.id === currentSessionId ? 'active' : ''}`;
      item.onclick = () => switchChat(c.id);

      item.innerHTML = `
        <div class="history-title">${escapeHtml(c.title || 'New chat')}</div>
        <button class="btn-delete-chat" onclick="deleteChat(event, '${c.id}')" title="Delete">✕</button>
      `;
      historyList.appendChild(item);
    });
  }

  function createNewChat() {
    const newId = 'chat_' + Math.random().toString(36).substr(2, 9);
    const chats = getStoredChats();
    chats.unshift({ id: newId, title: 'New chat', messages: [] });
    saveStoredChats(chats);

    currentSessionId = newId;
    renderHistorySidebar();
    clearMessagesUI();
  }

  function switchChat(id) {
    currentSessionId = id;
    renderHistorySidebar();
    const chats = getStoredChats();
    const chat = chats.find(c => c.id === id);

    clearMessagesUI();
    if (chat && chat.messages && chat.messages.length > 0) {
      if (heroCentered) heroCentered.style.display = 'none';
      if (headerBar) headerBar.classList.add('visible');
      chat.messages.forEach(m => renderMessageBubble(m.role, m.text));
    } else {
      if (heroCentered) heroCentered.style.display = 'flex';
      if (headerBar) headerBar.classList.remove('visible');
    }
  }

  function deleteChat(e, id) {
    e.stopPropagation();
    let chats = getStoredChats();
    chats = chats.filter(c => c.id !== id);
    saveStoredChats(chats);

    fetch('/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: id })
    }).catch(() => {});

    if (currentSessionId === id) {
      if (chats.length > 0) {
        switchChat(chats[0].id);
      } else {
        createNewChat();
      }
    } else {
      renderHistorySidebar();
    }
  }

  function clearMessagesUI() {
    const msgs = chatCanvas.querySelectorAll('.msg-row');
    msgs.forEach(m => m.remove());
    if (heroCentered) heroCentered.style.display = 'flex';
    if (headerBar) headerBar.classList.remove('visible');
  }

  function saveMessageToCurrentChat(role, text) {
    const chats = getStoredChats();
    const chat = chats.find(c => c.id === currentSessionId);
    if (chat) {
      chat.messages.push({ role, text });
      if (role === 'user' && (chat.title === 'New chat' || chat.messages.length <= 2)) {
        chat.title = text.substring(0, 26) + (text.length > 26 ? '...' : '');
      }
      saveStoredChats(chats);
      renderHistorySidebar();
    }
  }

  /* ── Auto-resize Textarea ───────────────────────────────── */
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isLoading) sendMessage();
    }
  });

  function formatText(text) {
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
    });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMessageBubble(role, text) {
    if (heroCentered && heroCentered.style.display !== 'none') {
      heroCentered.style.display = 'none';
      if (headerBar) headerBar.classList.add('visible');
    }

    const isUser = role === 'user';
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (isUser) {
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
    } else {
      row.innerHTML = `
        <div class="msg-avatar">
          <svg viewBox="0 0 100 100">
            <path d="M 22 25 L 78 25 L 78 35 L 57 35 L 57 80 L 43 80 L 43 35 L 22 35 Z" fill="#F3E5AB" />
          </svg>
        </div>
        <div class="msg-bubble">${formatText(text)}</div>
      `;
    }

    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.id = 'typing-indicator';
    row.innerHTML = `
      <div class="msg-avatar">
        <svg viewBox="0 0 100 100">
          <path d="M 22 25 L 78 25 L 78 35 L 57 35 L 57 80 L 43 80 L 43 35 L 22 35 Z" fill="#F3E5AB" />
        </svg>
      </div>
      <div class="typing-flair">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setLoading(loading) {
    isLoading = loading;
    sendBtn.disabled = loading;
    userInput.disabled = loading;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    userInput.value = '';
    userInput.style.height = 'auto';

    renderMessageBubble('user', text);
    saveMessageToCurrentChat('user', text);

    setLoading(true);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId }),
      });

      const data = await response.json();
      hideTyping();

      const reply = data.response || '❌ No response received.';
      renderMessageBubble('agent', reply);
      saveMessageToCurrentChat('agent', reply);

    } catch (err) {
      hideTyping();
      const errReply = `❌ Connection error: ${err.message}`;
      renderMessageBubble('agent', errReply);
      saveMessageToCurrentChat('agent', errReply);
    } finally {
      setLoading(false);
      userInput.focus();
    }
  }

  /* ── Init ────────────────────────────────────────────────── */
  window.addEventListener('load', () => {
    const chats = getStoredChats();
    if (chats.length === 0) {
      createNewChat();
    } else {
      currentSessionId = chats[0].id;
      switchChat(currentSessionId);
    }
  });
</script>

</body>
</html>
