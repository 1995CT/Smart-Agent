<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agent</title>
  
  <!-- Minimalist Clean Fonts (Inter + Noto Sans Gujarati) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Gujarati:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* ── Minimalist ChatGPT/Claude Palette ──────────────────────── */
    :root {
      --bg-dark:        #0d0d0d;
      --bg-sidebar:     #171717;
      --bg-chat-user:   #212121;
      --bg-input:       #212121;
      --border-color:   rgba(255, 255, 255, 0.1);
      
      --text-primary:   #ececec;
      --text-secondary: #b4b4b4;
      --text-muted:     #676767;
      
      --accent-color:   #10a37f; /* Clean ChatGPT Teal Accent */
      --accent-hover:   #1a7f64;

      --font-family:    'Inter', 'Noto Sans Gujarati', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── Slim Minimalist Sidebar ────────────────────────────────── */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 14px 12px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-new-chat:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 8px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-container::-webkit-scrollbar { width: 4px; }
    .history-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .history-item.active {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-delete-item {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .history-item:hover .btn-delete-item { opacity: 1; }
    .btn-delete-item:hover { color: #ef4444; }

    /* ── Main Chat Area ─────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-dark);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .message-wrapper {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 16px;
    }

    .message-wrapper.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      font-weight: 600;
    }

    .message-wrapper.agent .avatar {
      background-color: var(--accent-color);
      color: white;
    }

    .message-content {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .message-wrapper.user .message-content {
      background-color: var(--bg-chat-user);
      padding: 12px 18px;
      border-radius: 18px;
      border-top-right-radius: 4px;
      max-width: 80%;
    }

    .message-wrapper.agent .message-content {
      flex: 1;
      padding-top: 4px;
    }

    /* Code Blocks */
    .message-content pre {
      background: #000000;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 12px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13.5px;
    }

    .message-content code {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 13.5px;
    }

    .message-content pre code { background: none; padding: 0; }

    /* Typing Dots */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 8px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
      animation: pulse 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    /* Empty Welcome Center */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
      text-align: center;
      gap: 12px;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .empty-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ── Centered Input Bar ──────────────────────────────────────── */
    .input-area {
      padding: 16px 20px 24px;
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
    }

    .input-container {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 10px 16px;
      transition: border-color 0.2s ease;
    }

    .input-container:focus-within {
      border-color: rgba(255, 255, 255, 0.3);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 200px;
      min-height: 24px;
      padding: 2px 0;
    }

    #user-input::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background-color: var(--text-primary);
      color: var(--bg-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }

    .btn-send svg { width: 16px; height: 16px; fill: var(--bg-dark); }
    .btn-send:disabled { opacity: 0.2; cursor: not-allowed; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .input-area { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- ── Minimalist Sidebar ────────────────────────────────────── -->
  <aside class="sidebar">
    <button class="btn-new-chat" onclick="createNewChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <div class="sidebar-section-title">History</div>

    <div class="history-container" id="history-container">
      <!-- localStorage chat history items -->
    </div>
  </aside>

  <!-- ── Main Chat Area ─────────────────────────────────────────── -->
  <main class="chat-area">

    <div class="chat-messages" id="chat-messages">
      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">Smart Agent</div>
      </div>
    </div>

    <!-- Centered Floating Input Bar -->
    <div class="input-area">
      <div class="input-container">
        <textarea
          id="user-input"
          placeholder="Send a message..."
          rows="1"
        ></textarea>
        <button class="btn-send" id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </main>
</div>

<script>
  let currentSessionId = '';
  let isLoading = false;

  const chatMessages     = document.getElementById('chat-messages');
  const userInput        = document.getElementById('user-input');
  const sendBtn          = document.getElementById('send-btn');
  const emptyState       = document.getElementById('empty-state');
  const historyContainer = document.getElementById('history-container');

  /* ── Multi-Chat Storage (localStorage) ──────────────────── */
  function getStoredChats() {
    return JSON.parse(localStorage.getItem('smart_agent_chats') || '[]');
  }

  function saveStoredChats(chats) {
    localStorage.setItem('smart_agent_chats', JSON.stringify(chats));
  }

  function renderHistorySidebar() {
    const chats = getStoredChats();
    historyContainer.innerHTML = '';

    if (chats.length === 0) {
      historyContainer.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:8px;">No chat history</div>`;
      return;
    }

    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = `history-item ${c.id === currentSessionId ? 'active' : ''}`;
      item.onclick = () => switchChat(c.id);

      item.innerHTML = `
        <div class="history-title">${escapeHtml(c.title || 'New chat')}</div>
        <button class="btn-delete-item" onclick="deleteChat(event, '${c.id}')" title="Delete">✕</button>
      `;
      historyContainer.appendChild(item);
    });
  }

  function createNewChat() {
    const newId = 'chat_' + Math.random().toString(36).substr(2, 9);
    const chats = getStoredChats();
    chats.unshift({ id: newId, title: 'New chat', messages: [] });
    saveStoredChats(chats);

    currentSessionId = newId;
    renderHistorySidebar();
    clearMessagesUI();
  }

  function switchChat(id) {
    currentSessionId = id;
    renderHistorySidebar();
    const chats = getStoredChats();
    const chat = chats.find(c => c.id === id);

    clearMessagesUI();
    if (chat && chat.messages && chat.messages.length > 0) {
      if (emptyState) emptyState.style.display = 'none';
      chat.messages.forEach(m => renderMessageBubble(m.role, m.text));
    } else {
      if (emptyState) emptyState.style.display = 'flex';
    }
  }

  function deleteChat(e, id) {
    e.stopPropagation();
    let chats = getStoredChats();
    chats = chats.filter(c => c.id !== id);
    saveStoredChats(chats);

    fetch('/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: id })
    }).catch(() => {});

    if (currentSessionId === id) {
      if (chats.length > 0) {
        switchChat(chats[0].id);
      } else {
        createNewChat();
      }
    } else {
      renderHistorySidebar();
    }
  }

  function clearMessagesUI() {
    const msgs = chatMessages.querySelectorAll('.message-wrapper');
    msgs.forEach(m => m.remove());
    if (emptyState) emptyState.style.display = 'flex';
  }

  function saveMessageToCurrentChat(role, text) {
    const chats = getStoredChats();
    const chat = chats.find(c => c.id === currentSessionId);
    if (chat) {
      chat.messages.push({ role, text });
      if (role === 'user' && (chat.title === 'New chat' || chat.messages.length <= 2)) {
        chat.title = text.substring(0, 26) + (text.length > 26 ? '...' : '');
      }
      saveStoredChats(chats);
      renderHistorySidebar();
    }
  }

  /* ── Textarea Auto-resize ───────────────────────────────── */
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isLoading) sendMessage();
    }
  });

  function formatText(text) {
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
    });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMessageBubble(role, text) {
    if (emptyState && emptyState.style.display !== 'none') {
      emptyState.style.display = 'none';
    }

    const isUser = role === 'user';
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${role}`;

    if (isUser) {
      wrapper.innerHTML = `
        <div class="message-content">${escapeHtml(text)}</div>
      `;
    } else {
      wrapper.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="message-content">${formatText(text)}</div>
      `;
    }

    chatMessages.appendChild(wrapper);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper agent';
    wrapper.id = 'typing-indicator';
    wrapper.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="message-content">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
    chatMessages.appendChild(wrapper);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setLoading(loading) {
    isLoading = loading;
    sendBtn.disabled = loading;
    userInput.disabled = loading;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    userInput.value = '';
    userInput.style.height = 'auto';

    renderMessageBubble('user', text);
    saveMessageToCurrentChat('user', text);

    setLoading(true);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId }),
      });

      const data = await response.json();
      hideTyping();

      const reply = data.response || '❌ No response received.';
      renderMessageBubble('agent', reply);
      saveMessageToCurrentChat('agent', reply);

    } catch (err) {
      hideTyping();
      const errReply = `❌ Connection error: ${err.message}`;
      renderMessageBubble('agent', errReply);
      saveMessageToCurrentChat('agent', errReply);
    } finally {
      setLoading(false);
      userInput.focus();
    }
  }

  /* ── Init ────────────────────────────────────────────────── */
  window.addEventListener('load', () => {
    const chats = getStoredChats();
    if (chats.length === 0) {
      createNewChat();
    } else {
      currentSessionId = chats[0].id;
      switchChat(currentSessionId);
    }
  });
</script>

</body>
</html>
