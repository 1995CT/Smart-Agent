<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agent</title>
  
  <!-- Premium Fonts: Outfit (Display) + Plus Jakarta Sans + Noto Sans Gujarati -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* ── Minimalist Clean Warm Dark Palette ────────────────────── */
    :root {
      --bg-dark:          #08090c;
      --bg-sidebar:       #11131c;
      --bg-input:         #161924;

      --warm-gold:        #d4af37;
      --warm-gold-light:  #f3e5ab;
      --warm-gold-dim:    rgba(212, 175, 55, 0.15);
      --warm-amber:       #f59e0b;

      --text-main:        #f1f5f9;
      --text-secondary:   #94a3b8;
      --text-muted:       #676767;

      --border-subtle:    rgba(255, 255, 255, 0.08);
      --border-gold:      rgba(212, 175, 55, 0.35);

      --font-display:     'Outfit', 'Noto Sans Gujarati', sans-serif;
      --font-body:        'Plus Jakarta Sans', 'Noto Sans Gujarati', sans-serif;

      --radius-xl:        24px;
      --radius-lg:        16px;
      --radius-md:        10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.04) 0%, transparent 60%);
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── Slim Minimal Sidebar ───────────────────────────────────── */
    .sidebar {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--warm-gold-light);
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateY(-1px);
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--warm-gold);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin: 12px 6px 2px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .history-item.active {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--border-gold);
      color: var(--warm-gold-light);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-delete-chat {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      opacity: 0;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .history-item:hover .btn-delete-chat { opacity: 1; }
    .btn-delete-chat:hover { color: #ef4444; }

    /* ── Main Stage ─────────────────────────────────────────────── */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-dark);
    }

    /* Top Header Bar */
    .header-bar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .header-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo-mini-img {
      height: 28px;
      width: auto;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
    }

    .header-title-text {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--warm-gold-light);
    }

    /* ── Chat Canvas ─────────────────────────────────────────────── */
    .chat-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .chat-canvas::-webkit-scrollbar { width: 6px; }
    .chat-canvas::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px;
    }

    /* ── EXACT PAGE CENTER HERO BLOCK (Logo + Title + Input Box ALL IN CENTER) ─ */
    .hero-centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
      text-align: center;
      gap: 20px;
      padding: 0 20px;
      width: 100%;
      max-width: 680px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-stage-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 190px;
      height: 190px;
    }

    /* Subtle Soft Dim Golden Backlight Glow directly behind Golden T */
    .golden-dim-backlight {
      position: absolute;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.22) 0%, rgba(212, 175, 55, 0.07) 55%, transparent 70%);
      filter: blur(28px);
      animation: dimGlowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes dimGlowPulse {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0.95; }
    }

    /* Perfect Golden 3D 'T' Image (Exact User Image, 0 Black holes, 0 Box lines) */
    .golden-t-img {
      position: relative;
      height: 160px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.35)) drop-shadow(0 12px 25px rgba(0,0,0,0.85));
      z-index: 2;
      display: block;
      transition: transform 0.3s ease;
    }

    .golden-t-img:hover {
      transform: scale(1.03);
    }

    .hero-headline {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    /* ── CENTERED INPUT BOX (Positioned Right Below Logo/Title) ──── */
    .hero-input-box-wrapper {
      width: 100%;
      max-width: 600px;
    }

    .input-pill-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 10px 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .input-pill-bar:focus-within {
      border-color: var(--warm-gold);
      box-shadow: 0 10px 40px rgba(212, 175, 55, 0.15);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 180px;
      min-height: 26px;
      padding: 4px 0;
      text-align: center; /* Centered Placeholder & Text */
    }

    #user-input::placeholder {
      color: var(--text-muted);
      text-align: center; /* Centered Placeholder */
    }

    .btn-send-gold {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--warm-gold), var(--warm-amber));
      color: #0c0d12;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--warm-gold-dim);
    }

    .btn-send-gold svg {
      width: 16px;
      height: 16px;
      fill: #0c0d12;
    }

    .btn-send-gold:hover:not(:disabled) {
      transform: scale(1.06);
    }

    .btn-send-gold:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    /* Dock Container (Active when conversation starts) */
    .dock-container {
      padding: 16px 20px 24px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      z-index: 10;
      display: none; /* Shown when chat active */
    }

    /* ── Messages ────────────────────────────────────────────────── */
    .msg-row {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 16px;
      animation: msgFadeIn 0.35s ease;
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }

    .msg-avatar {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .msg-avatar img {
      height: 28px;
      width: auto;
      filter: drop-shadow(0 0 6px var(--warm-gold-dim));
    }

    .msg-bubble {
      font-size: 15px;
      line-height: 1.65;
    }

    .msg-row.user .msg-bubble {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--border-gold);
      padding: 12px 20px;
      border-radius: 20px;
      border-top-right-radius: 4px;
      max-width: 80%;
      color: var(--warm-gold-light);
    }

    .msg-row.agent .msg-bubble {
      flex: 1;
      padding-top: 4px;
      color: var(--text-main);
    }

    .msg-bubble pre {
      background: #06070a;
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13.5px;
    }

    .msg-bubble code {
      background: rgba(212, 175, 55, 0.1);
      color: var(--warm-gold-light);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
    }

    .msg-bubble pre code { background: none; padding: 0; color: inherit; }

    /* Typing Dots */
    .typing-flair {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 8px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warm-gold);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.7); }
      40% { opacity: 1; transform: scale(1.1); background: var(--warm-gold-light); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .dock-container, .hero-input-box-wrapper { padding: 0 16px; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ── Slim Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar">
    <button class="btn-new-chat" onclick="createNewChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      + New Chat
    </button>

    <div class="sidebar-label">Chat History</div>

    <div class="history-list" id="history-list">
      <!-- localStorage Chat Items -->
    </div>
  </aside>

  <!-- ── Main Stage ─────────────────────────────────────────────── -->
  <main class="main-stage">

    <!-- Header Bar (Appears when chat starts) -->
    <header class="header-bar" id="header-bar">
      <div class="header-brand">
        <img src="/static/golden_t_final.png" class="header-logo-mini-img" alt="Logo">
        <div class="header-title-text">Smart Agent</div>
      </div>
    </header>

    <!-- Chat Canvas -->
    <div class="chat-canvas" id="chat-canvas">

      <!-- EXACT PAGE CENTER HERO BLOCK (Logo + Title + Input Box ALL IN CENTER) -->
      <div class="hero-centered" id="hero-centered">
        <div class="logo-stage-wrapper">
          <!-- Soft Dim Golden Backlight Glow directly behind Golden T -->
          <div class="golden-dim-backlight"></div>

          <!-- Perfect Golden 3D 'T' Image (0 Black holes, 0 Box lines) -->
          <img src="/static/golden_t_final.png" class="golden-t-img" alt="Golden T Logo">
        </div>

        <div class="hero-headline">How can I help you today?</div>

        <!-- Input Box Centered Directly Below Logo & Headline -->
        <div class="hero-input-box-wrapper" id="hero-input-wrapper">
          <div class="input-pill-bar">
            <textarea
              id="user-input"
              placeholder="How can I help you today?"
              rows="1"
            ></textarea>
            <button class="btn-send-gold" id="send-btn" onclick="sendMessage()" title="Send">
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Dock Container (Only for ongoing active conversation stream) -->
    <div class="dock-container" id="bottom-dock">
      <!-- Moved here dynamically when chat starts -->
    </div>

  </main>
</div>

<script>
  let currentSessionId = '';
  let isLoading = false;

  const chatCanvas       = document.getElementById('chat-canvas');
  const userInput        = document.getElementById('user-input');
  const sendBtn          = document.getElementById('send-btn');
  const heroCentered     = document.getElementById('hero-centered');
  const headerBar        = document.getElementById('header-bar');
  const historyList      = document.getElementById('history-list');
  const heroInputWrapper = document.getElementById('hero-input-wrapper');
  const bottomDock       = document.getElementById('bottom-dock');

  /* ── Multi-Chat Storage (localStorage) ──────────────────── */
  function getStoredChats() {
    return JSON.parse(localStorage.getItem('smart_agent_chats') || '[]');
  }

  function saveStoredChats(chats) {
    localStorage.setItem('smart_agent_chats', JSON.stringify(chats));
  }

  function renderHistorySidebar() {
    const chats = getStoredChats();
    historyList.innerHTML = '';

    if (chats.length === 0) {
      historyList.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:8px;">No chat history</div>`;
      return;
    }

    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = `history-item ${c.id === currentSessionId ? 'active' : ''}`;
      item.onclick = () => switchChat(c.id);

      item.innerHTML = `
        <div class="history-title">${escapeHtml(c.title || 'New chat')}</div>
        <button class="btn-delete-chat" onclick="deleteChat(event, '${c.id}')" title="Delete">✕</button>
      `;
      historyList.appendChild(item);
    });
  }

  function createNewChat() {
    const newId = 'chat_' + Math.random().toString(36).substr(2, 9);
    const chats = getStoredChats();
    chats.unshift({ id: newId, title: 'New chat', messages: [] });
    saveStoredChats(chats);

    currentSessionId = newId;
    renderHistorySidebar();
    clearMessagesUI();
  }

  function switchChat(id) {
    currentSessionId = id;
    renderHistorySidebar();
    const chats = getStoredChats();
    const chat = chats.find(c => c.id === id);

    clearMessagesUI();
    if (chat && chat.messages && chat.messages.length > 0) {
      if (heroCentered) heroCentered.style.display = 'none';
      if (headerBar) headerBar.classList.add('visible');
      
      // Move input box to bottom dock when active chat
      const pillBar = document.querySelector('.input-pill-bar');
      if (pillBar && bottomDock) {
        bottomDock.appendChild(pillBar);
        bottomDock.style.display = 'block';
        userInput.style.textAlign = 'left';
      }

      chat.messages.forEach(m => renderMessageBubble(m.role, m.text));
    } else {
      if (heroCentered) heroCentered.style.display = 'flex';
      if (headerBar) headerBar.classList.remove('visible');

      // Move input box back to page center
      const pillBar = document.querySelector('.input-pill-bar');
      if (pillBar && heroInputWrapper) {
        heroInputWrapper.appendChild(pillBar);
        bottomDock.style.display = 'none';
        userInput.style.textAlign = 'center';
      }
    }
  }

  function deleteChat(e, id) {
    e.stopPropagation();
    let chats = getStoredChats();
    chats = chats.filter(c => c.id !== id);
    saveStoredChats(chats);

    fetch('/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: id })
    }).catch(() => {});

    if (currentSessionId === id) {
      if (chats.length > 0) {
        switchChat(chats[0].id);
      } else {
        createNewChat();
      }
    } else {
      renderHistorySidebar();
    }
  }

  function clearMessagesUI() {
    const msgs = chatCanvas.querySelectorAll('.msg-row');
    msgs.forEach(m => m.remove());
    if (heroCentered) heroCentered.style.display = 'flex';
    if (headerBar) headerBar.classList.remove('visible');
  }

  function saveMessageToCurrentChat(role, text) {
    const chats = getStoredChats();
    const chat = chats.find(c => c.id === currentSessionId);
    if (chat) {
      chat.messages.push({ role, text });
      if (role === 'user' && (chat.title === 'New chat' || chat.messages.length <= 2)) {
        chat.title = text.substring(0, 26) + (text.length > 26 ? '...' : '');
      }
      saveStoredChats(chats);
      renderHistorySidebar();
    }
  }

  /* ── Auto-resize Textarea ───────────────────────────────── */
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isLoading) sendMessage();
    }
  });

  function formatText(text) {
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
    });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMessageBubble(role, text) {
    if (heroCentered && heroCentered.style.display !== 'none') {
      heroCentered.style.display = 'none';
      if (headerBar) headerBar.classList.add('visible');

      // Move input box to bottom dock
      const pillBar = document.querySelector('.input-pill-bar');
      if (pillBar && bottomDock) {
        bottomDock.appendChild(pillBar);
        bottomDock.style.display = 'block';
        userInput.style.textAlign = 'left';
      }
    }

    const isUser = role === 'user';
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (isUser) {
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
    } else {
      row.innerHTML = `
        <div class="msg-avatar">
          <img src="/static/golden_t_final.png" alt="Logo">
        </div>
        <div class="msg-bubble">${formatText(text)}</div>
      `;
    }

    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.id = 'typing-indicator';
    row.innerHTML = `
      <div class="msg-avatar">
        <img src="/static/golden_t_final.png" alt="Logo">
      </div>
      <div class="typing-flair">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setLoading(loading) {
    isLoading = loading;
    sendBtn.disabled = loading;
    userInput.disabled = loading;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    userInput.value = '';
    userInput.style.height = 'auto';

    renderMessageBubble('user', text);
    saveMessageToCurrentChat('user', text);

    setLoading(true);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId }),
      });

      const data = await response.json();
      hideTyping();

      const reply = data.response || '❌ No response received.';
      renderMessageBubble('agent', reply);
      saveMessageToCurrentChat('agent', reply);

    } catch (err) {
      hideTyping();
      const errReply = `❌ Connection error: ${err.message}`;
      renderMessageBubble('agent', errReply);
      saveMessageToCurrentChat('agent', errReply);
    } finally {
      setLoading(false);
      userInput.focus();
    }
  }

  /* ── Init ────────────────────────────────────────────────── */
  window.addEventListener('load', () => {
    const chats = getStoredChats();
    if (chats.length === 0) {
      createNewChat();
    } else {
      currentSessionId = chats[0].id;
      switchChat(currentSessionId);
    }
  });
</script>

</body>
</html>
