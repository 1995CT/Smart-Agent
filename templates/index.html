<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agent</title>
  <meta name="description" content="Smart Agent — Elite AI powered by Groq LLaMA 3.3 70B" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Markdown + Syntax -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg:         #000000;
      --bg-sidebar: #000000;
      --bg-input:   #1a1a1a;
      --bg-hover:   rgba(255,255,255,0.06);
      --bg-active:  rgba(255,255,255,0.10);
      --bg-code:    #111111;

      --text:       #e8e8e8;
      --text-2:     #888888;
      --text-3:     #444444;

      --border:     rgba(255,255,255,0.10);
      --border-2:   rgba(255,255,255,0.06);

      --gold:       #d4a853;
      --gold-glow:  rgba(212,168,83,0.22);

      --font:       'Inter', 'Noto Sans Gujarati', sans-serif;
      --font-code:  'JetBrains Mono', monospace;

      --sidebar-w:  52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; height: 100vh; width: 100vw; }

    /* ── Icon Sidebar (Grok style) ─────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      flex-shrink: 0;
      z-index: 30;
    }

    .sb-logo {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }

    .sb-logo img {
      height: 28px;
      filter: drop-shadow(0 0 6px var(--gold-glow));
    }

    .sb-sep {
      width: 28px;
      height: 1px;
      background: var(--border-2);
      margin: 4px 0;
    }

    .sb-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
      border: none;
      background: none;
      position: relative;
    }

    .sb-btn:hover { background: var(--bg-hover); color: var(--text); }
    .sb-btn.active { background: var(--bg-active); color: var(--text); }

    .sb-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Tooltip */
    .sb-btn::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: #1c1c1c;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
    }

    .sb-btn:hover::after { opacity: 1; }

    .sb-spacer { flex: 1; }

    .sb-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      margin-bottom: 4px;
    }

    /* ── Chat History Flyout (on hover) ─────────────────────────── */
    .history-panel {
      position: fixed;
      left: var(--sidebar-w);
      top: 0;
      height: 100vh;
      width: 260px;
      background: #0c0c0c;
      border-right: 1px solid var(--border-2);
      z-index: 29;
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
      gap: 6px;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .history-panel.open {
      transform: translateX(0);
      pointer-events: auto;
    }

    .hp-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 0 6px 6px;
      border-bottom: 1px solid var(--border-2);
    }

    .hp-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .hp-list::-webkit-scrollbar { width: 3px; }
    .hp-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .hp-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-2);
      transition: background 0.14s, color 0.14s;
      gap: 8px;
    }

    .hp-item:hover { background: var(--bg-hover); color: var(--text); }
    .hp-item.active { background: var(--bg-active); color: var(--text); }

    .hp-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .hp-del {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: opacity 0.14s, color 0.14s;
    }

    .hp-item:hover .hp-del { opacity: 1; }
    .hp-del:hover { color: #ef4444; }

    /* ── Main ───────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar (only during chat) ──────────────────────────────── */
    .top-bar {
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 10px;
      border-bottom: 1px solid var(--border-2);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .top-bar.visible { opacity: 1; }

    .top-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .top-bar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-2);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-2);
      border-radius: 20px;
      padding: 4px 10px;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 5px #22c55e80;
      animation: blink 2.2s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }

    .btn-new-top {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.14s;
    }

    .btn-new-top:hover { background: var(--bg-hover); color: var(--text); }

    /* ── Chat Canvas ─────────────────────────────────────────────── */
    .chat-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 16px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }

    .chat-canvas::-webkit-scrollbar { width: 4px; }
    .chat-canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    /* ── Hero ────────────────────────────────────────────────────── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 20px;
      padding: 0 20px 60px;
      text-align: center;
    }

    .hero-logo {
      position: relative;
      width: 72px; height: 72px;
      display: flex; align-items: center; justify-content: center;
    }

    .hero-glow {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
      filter: blur(16px);
      animation: heroGlow 3.5s ease-in-out infinite alternate;
    }

    @keyframes heroGlow {
      0%   { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.3);  opacity: 1; }
    }

    .hero-logo-img {
      height: 60px;
      width: auto;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }

    .hero-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    /* ── Suggestion Chips (Grok style) ───────────────────────────── */
    .hero-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 560px;
    }

    .chip {
      padding: 8px 16px;
      background: #111111;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      background: var(--bg-hover);
      border-color: rgba(255,255,255,0.2);
      color: var(--text);
    }

    /* ── Hero Input Wrapper ──────────────────────────────────────── */
    .hero-input-wrap {
      width: 100%;
      max-width: 620px;
    }

    /* ── Input Bar ───────────────────────────────────────────────── */
    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px 10px 16px;
      transition: border-color 0.22s;
    }

    .input-bar:focus-within {
      border-color: rgba(255,255,255,0.25);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 200px;
      min-height: 26px;
      padding: 2px 0;
      text-align: center;
    }

    #user-input::placeholder { color: var(--text-3); text-align: center; }

    .input-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-send {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: none;
      background: var(--text);
      color: #000;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .btn-send:hover:not(:disabled) { background: #fff; }
    .btn-send:disabled { opacity: 0.2; cursor: not-allowed; }
    .btn-send svg { width: 15px; height: 15px; fill: #000; }

    /* Bottom dock */
    .input-dock {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 16px 20px;
      display: none;
    }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
      margin-top: 7px;
    }

    /* ── Messages ────────────────────────────────────────────────── */
    .msg-row {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      gap: 14px;
      animation: msgIn 0.28s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { justify-content: flex-end; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
    }

    .msg-avatar img { height: 26px; filter: drop-shadow(0 0 4px var(--gold-glow)); }

    .msg-row.user .msg-bubble {
      max-width: 76%;
      background: #1a1a1a;
      border: 1px solid var(--border);
      padding: 11px 17px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
    }

    .msg-row.agent .msg-bubble {
      flex: 1;
      font-size: 14.5px;
      line-height: 1.78;
      color: var(--text);
      min-width: 0;
    }

    /* Markdown */
    .msg-bubble h1,.msg-bubble h2,.msg-bubble h3 {
      font-weight: 600; margin: 14px 0 6px; line-height: 1.3; color: var(--text);
    }
    .msg-bubble h1{font-size:18px;} .msg-bubble h2{font-size:16px;} .msg-bubble h3{font-size:14.5px;}
    .msg-bubble p { margin: 0 0 10px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble ul,.msg-bubble ol { padding-left: 20px; margin: 6px 0 10px; display:flex; flex-direction:column; gap:3px; }
    .msg-bubble li { line-height: 1.65; }
    .msg-bubble strong { font-weight: 600; color: #fff; }
    .msg-bubble em { color: var(--text-2); }
    .msg-bubble a { color: var(--gold); text-decoration: underline; }
    .msg-bubble hr { border: none; border-top: 1px solid var(--border-2); margin: 12px 0; }

    .msg-bubble :not(pre) > code {
      font-family: var(--font-code);
      font-size: 12.5px;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border-2);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .msg-bubble table {
      width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px;
    }
    .msg-bubble th {
      background: rgba(255,255,255,0.06); font-weight: 600;
      padding: 7px 12px; border: 1px solid var(--border-2); text-align: left;
    }
    .msg-bubble td { padding: 6px 12px; border: 1px solid var(--border-2); }

    /* Code block */
    .code-wrap {
      position: relative;
      margin: 10px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      background: var(--bg-code);
    }

    .code-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: #0a0a0a;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .code-lang {
      font-family: var(--font-code);
      font-size: 10.5px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .btn-copy {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-2);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.14s;
    }

    .btn-copy:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .btn-copy.ok { color: #22c55e; border-color: rgba(34,197,94,0.35); }

    .msg-bubble pre {
      margin: 0; padding: 14px 16px;
      overflow-x: auto;
      background: var(--bg-code);
    }

    .msg-bubble pre code.hljs {
      font-family: var(--font-code);
      font-size: 12.5px;
      background: transparent;
      padding: 0; border: none;
    }

    /* ── Message actions ─────────────────────────────────────────── */
    .msg-actions {
      display: flex;
      gap: 2px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.14s;
    }
    .msg-row.agent:hover .msg-actions { opacity: 1; }

    .msg-act-btn {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--text-3);
      background: none; border: none;
      cursor: pointer; padding: 3px 7px;
      border-radius: 5px;
      font-family: var(--font);
      transition: all 0.13s;
    }
    .msg-act-btn:hover { background: var(--bg-hover); color: var(--text-2); }

    /* ── Typing indicator ────────────────────────────────────────── */
    .typing-dots {
      display: flex; gap: 4px;
      align-items: center;
      padding: 8px 0 4px;
    }

    .td { width: 6px; height: 6px; border-radius: 50%; background: var(--text-2); animation: tdAnim 1.4s infinite ease-in-out both; }
    .td:nth-child(2){animation-delay:.18s}
    .td:nth-child(3){animation-delay:.36s}

    @keyframes tdAnim {
      0%,80%,100% { transform: scale(0.7); opacity: 0.35; }
      40%         { transform: scale(1.2); opacity: 1; }
    }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 640px) {
      :root { --sidebar-w: 44px; }
      .hero-title { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ── Icon Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">

    <!-- Logo -->
    <div class="sb-logo">
      <img src="/static/golden_t_final.png" alt="Smart Agent" />
    </div>

    <div class="sb-sep"></div>

    <!-- New chat -->
    <button class="sb-btn" data-tip="New Chat" onclick="createNewChat()" id="sb-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>

    <!-- History -->
    <button class="sb-btn" data-tip="Chat History" id="sb-hist" onclick="toggleHistory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M12 6v6l4 2"/>
      </svg>
    </button>

    <!-- Search -->
    <button class="sb-btn" data-tip="Search chats" onclick="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </button>

    <!-- Settings -->
    <button class="sb-btn" data-tip="Settings" onclick="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>

    <div class="sb-spacer"></div>

    <!-- Avatar -->
    <div class="sb-avatar" data-tip="Account" style="position:relative;">T</div>

  </aside>

  <!-- ── History Flyout Panel ──────────────────────────────────── -->
  <div class="history-panel" id="history-panel">
    <div class="hp-title">Chat History</div>
    <div class="hp-list" id="hp-list"></div>
  </div>

  <!-- ── Main ─────────────────────────────────────────────────── -->
  <main class="main" id="main-area">

    <!-- Top Bar (active chat) -->
    <div class="top-bar" id="top-bar">
      <span class="top-title" id="top-title">Smart Agent</span>
      <div class="top-bar-right">
        <div class="model-pill">
          <div class="live-dot"></div>
          LLaMA 3.3 70B
        </div>
        <button class="btn-new-top" onclick="createNewChat()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          New
        </button>
      </div>
    </div>

    <!-- Chat Canvas -->
    <div class="chat-canvas" id="chat-canvas">

      <!-- Hero -->
      <div class="hero" id="hero">

        <div class="hero-logo">
          <div class="hero-glow"></div>
          <img src="/static/golden_t_final.png" class="hero-logo-img" alt="Smart Agent" />
        </div>

        <div class="hero-title">What do you want to know?</div>

        <!-- Chips -->
        <div class="hero-chips">
          <div class="chip" onclick="chipSend('Flutter app with Firebase login banavaj')">📱 Flutter + Firebase</div>
          <div class="chip" onclick="chipSend('React dashboard with charts')">⚛️ React Dashboard</div>
          <div class="chip" onclick="chipSend('Python FastAPI REST API with JWT')">🐍 FastAPI + JWT</div>
          <div class="chip" onclick="chipSend('SQL query optimization tips')">🗃️ SQL Optimize</div>
          <div class="chip" onclick="chipSend('Docker + Nginx deployment setup')">🐳 Docker Deploy</div>
          <div class="chip" onclick="chipSend('Git branching strategy for team')">🌿 Git Strategy</div>
        </div>

        <!-- Hero Input -->
        <div class="hero-input-wrap" id="hero-input-wrap">
          <div class="input-bar" id="input-bar">
            <textarea id="user-input" rows="1" placeholder="What do you want to know?"></textarea>
            <div class="input-right">
              <button class="btn-send" id="send-btn" onclick="sendMessage()" title="Send">
                <svg viewBox="0 0 24 24"><path d="M2 12L22 2 14 22 11 13z"/></svg>
              </button>
            </div>
          </div>
        </div>

      </div>
      <!-- /hero -->

    </div>
    <!-- /chat-canvas -->

    <!-- Bottom Dock -->
    <div class="input-dock" id="input-dock"></div>

  </main>
</div>

<script>
  /* ── Marked config ──────────────────────────────────────────── */
  const mdRenderer = new marked.Renderer();
  mdRenderer.code = function(code, lang) {
    const language = lang || 'text';
    let highlighted = escHtml(code);
    try {
      if (hljs.getLanguage(language)) {
        highlighted = hljs.highlight(code, { language }).value;
      } else {
        highlighted = hljs.highlightAuto(code).value;
      }
    } catch(e) {}
    const uid = 'cb_' + Math.random().toString(36).substr(2, 7);
    return `<div class="code-wrap">
      <div class="code-hdr">
        <span class="code-lang">${language}</span>
        <button class="btn-copy" id="${uid}" onclick="copyCode('${uid}')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
      </div>
      <pre><code class="hljs" data-raw="${escHtml(code)}">${highlighted}</code></pre>
    </div>`;
  };
  marked.use({ renderer: mdRenderer, breaks: true, gfm: true });

  /* ── State ──────────────────────────────────────────────────── */
  let sessId = '', isLoading = false, chatActive = false, histOpen = false;

  const chatCanvas  = document.getElementById('chat-canvas');
  const hero        = document.getElementById('hero');
  const heroInWrap  = document.getElementById('hero-input-wrap');
  const inputDock   = document.getElementById('input-dock');
  const inputBar    = document.getElementById('input-bar');
  const userInput   = document.getElementById('user-input');
  const sendBtn     = document.getElementById('send-btn');
  const topBar      = document.getElementById('top-bar');
  const hpList      = document.getElementById('hp-list');
  const histPanel   = document.getElementById('history-panel');

  /* ── Storage ────────────────────────────────────────────────── */
  const getChats = () => JSON.parse(localStorage.getItem('sa2_chats') || '[]');
  const saveChats = c => localStorage.setItem('sa2_chats', JSON.stringify(c));

  function renderHP() {
    const chats = getChats();
    hpList.innerHTML = '';
    if (!chats.length) {
      hpList.innerHTML = `<div style="font-size:12px;color:var(--text-3);padding:8px 6px;">No chats yet</div>`;
      return;
    }
    chats.forEach(c => {
      const el = document.createElement('div');
      el.className = `hp-item${c.id === sessId ? ' active' : ''}`;
      el.onclick = () => { switchChat(c.id); if(window.innerWidth < 640) closeHistory(); };
      el.innerHTML = `
        <span class="hp-item-title">${escHtml(c.title || 'New Chat')}</span>
        <button class="hp-del" onclick="delChat(event,'${c.id}')">✕</button>
      `;
      hpList.appendChild(el);
    });
  }

  function toggleHistory() {
    histOpen = !histOpen;
    histPanel.classList.toggle('open', histOpen);
    document.getElementById('sb-hist').classList.toggle('active', histOpen);
  }

  function closeHistory() {
    histOpen = false;
    histPanel.classList.remove('open');
    document.getElementById('sb-hist').classList.remove('active');
  }

  /* ── Chat lifecycle ─────────────────────────────────────────── */
  function createNewChat() {
    const id = 'c_' + Date.now();
    const chats = getChats();
    chats.unshift({ id, title: 'New Chat', messages: [] });
    saveChats(chats);
    sessId = id;
    resetHero();
    renderHP();
  }

  function switchChat(id) {
    sessId = id;
    const chats = getChats();
    const chat = chats.find(c => c.id === id);
    chatCanvas.querySelectorAll('.msg-row').forEach(r => r.remove());
    if (chat && chat.messages && chat.messages.length) {
      activateChat();
      chat.messages.forEach(m => renderBubble(m.role, m.text, false));
      if (chat.title) document.getElementById('top-title').textContent = chat.title;
    } else {
      resetHero();
    }
    renderHP();
  }

  function delChat(e, id) {
    e.stopPropagation();
    let chats = getChats().filter(c => c.id !== id);
    saveChats(chats);
    fetch('/clear', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: id}) }).catch(()=>{});
    if (sessId === id) {
      if (chats.length) switchChat(chats[0].id);
      else createNewChat();
    } else {
      renderHP();
    }
  }

  function saveMsg(role, text) {
    const chats = getChats();
    const chat = chats.find(c => c.id === sessId);
    if (chat) {
      chat.messages.push({ role, text });
      if (role === 'user' && (chat.title === 'New Chat' || chat.messages.length <= 2)) {
        chat.title = text.substring(0, 30) + (text.length > 30 ? '…' : '');
        document.getElementById('top-title').textContent = chat.title;
      }
      saveChats(chats);
      renderHP();
    }
  }

  /* ── UI transitions ─────────────────────────────────────────── */
  function activateChat() {
    chatActive = true;
    hero.style.display = 'none';
    topBar.classList.add('visible');
    if (heroInWrap.contains(inputBar)) {
      inputDock.innerHTML = '';
      inputDock.appendChild(inputBar);
      const hint = document.createElement('div');
      hint.className = 'input-hint';
      hint.textContent = 'Enter · Shift+Enter for newline';
      inputDock.appendChild(hint);
      inputDock.style.display = 'block';
    }
    userInput.style.textAlign = 'left';
    userInput.placeholder = 'Ask anything…';
  }

  function resetHero() {
    chatActive = false;
    chatCanvas.querySelectorAll('.msg-row').forEach(r => r.remove());
    hero.style.display = 'flex';
    topBar.classList.remove('visible');
    if (inputDock.contains(inputBar)) {
      heroInWrap.appendChild(inputBar);
      inputDock.style.display = 'none';
    }
    userInput.style.textAlign = 'center';
    userInput.placeholder = 'What do you want to know?';
    userInput.value = '';
    userInput.style.height = 'auto';
  }

  /* ── Textarea resize ────────────────────────────────────────── */
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
  });

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isLoading) sendMessage(); }
  });

  function chipSend(text) {
    userInput.value = text;
    userInput.dispatchEvent(new Event('input'));
    sendMessage();
  }

  /* ── Render bubble ──────────────────────────────────────────── */
  function renderBubble(role, text, animate = true) {
    if (!chatActive) activateChat();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    if (!animate) row.style.animation = 'none';

    if (role === 'user') {
      row.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    } else {
      row.innerHTML = `
        <div class="msg-avatar"><img src="/static/golden_t_final.png" alt="SA"></div>
        <div style="flex:1;min-width:0;">
          <div class="msg-bubble">${marked.parse(text || '')}</div>
          <div class="msg-actions">
            <button class="msg-act-btn" onclick="copyMsg(this)">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              Copy
            </button>
          </div>
        </div>
      `;
    }
    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
    return row;
  }

  /* ── Word-by-word typing effect ─────────────────────────────── */
  async function typeReply(text) {
    if (!chatActive) activateChat();
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="msg-avatar"><img src="/static/golden_t_final.png" alt="SA"></div>
      <div style="flex:1;min-width:0;">
        <div class="msg-bubble" id="tb"></div>
        <div class="msg-actions" style="opacity:0">
          <button class="msg-act-btn" onclick="copyMsg(this)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
    `;
    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;

    const bubble = row.querySelector('#tb');
    bubble.id = '';

    const words = text.split(' ');
    let acc = '';
    for (let i = 0; i < words.length; i++) {
      acc += (i === 0 ? '' : ' ') + words[i];
      bubble.innerHTML = marked.parse(acc);
      chatCanvas.scrollTop = chatCanvas.scrollHeight;
      await new Promise(r => setTimeout(r, 16));
    }
    bubble.innerHTML = marked.parse(text);
    const acts = row.querySelector('.msg-actions');
    if (acts) acts.style.opacity = '';
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
  }

  /* ── Typing indicator ───────────────────────────────────────── */
  function showTyping() {
    if (!chatActive) activateChat();
    const row = document.createElement('div');
    row.id = 'ti';
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="msg-avatar"><img src="/static/golden_t_final.png" alt="SA"></div>
      <div class="typing-dots"><div class="td"></div><div class="td"></div><div class="td"></div></div>
    `;
    chatCanvas.appendChild(row);
    chatCanvas.scrollTop = chatCanvas.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('ti');
    if (el) el.remove();
  }

  /* ── Send ───────────────────────────────────────────────────── */
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;
    if (!sessId) createNewChat();

    userInput.value = '';
    userInput.style.height = 'auto';

    renderBubble('user', text);
    saveMsg('user', text);

    isLoading = true;
    sendBtn.disabled = true;
    userInput.disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessId }),
      });
      const data = await res.json();
      hideTyping();
      const reply = data.response || '❌ No response.';
      await typeReply(reply);
      saveMsg('agent', reply);
    } catch(e) {
      hideTyping();
      renderBubble('agent', '❌ Network error. Server check karo.');
    }

    isLoading = false;
    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();
  }

  /* ── Copy helpers ───────────────────────────────────────────── */
  function copyCode(id) {
    const btn = document.getElementById(id);
    if (!btn) return;
    const code = btn.closest('.code-wrap').querySelector('code');
    const raw = code.getAttribute('data-raw') || code.innerText;
    navigator.clipboard.writeText(raw).then(() => {
      btn.classList.add('ok');
      btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
      setTimeout(() => {
        btn.classList.remove('ok');
        btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
      }, 2000);
    });
  }

  function copyMsg(btn) {
    const bubble = btn.closest('div').previousElementSibling;
    if (!bubble) return;
    navigator.clipboard.writeText(bubble.innerText).then(() => {
      btn.textContent = '✓ Copied!';
      setTimeout(() => { btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`; }, 2000);
    });
  }

  function escHtml(t) {
    return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Close history on outside click ────────────────────────── */
  document.addEventListener('click', e => {
    if (histOpen && !histPanel.contains(e.target) && !document.getElementById('sb-hist').contains(e.target)) {
      closeHistory();
    }
  });

  /* ── Init ───────────────────────────────────────────────────── */
  (function() {
    const chats = getChats();
    if (chats.length) {
      sessId = chats[0].id;
      renderHP();
      if (chats[0].messages && chats[0].messages.length) {
        activateChat();
        chats[0].messages.forEach(m => renderBubble(m.role, m.text, false));
        document.getElementById('top-title').textContent = chats[0].title || 'Smart Agent';
      }
    } else {
      createNewChat();
    }
    userInput.focus();
  })();
</script>

</body>
</html>
